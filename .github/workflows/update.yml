name: Daily content update

# Every day: pull new material from each registered source, check that the site
# still builds and passes its tests, and save the new data to main.
# Cloudflare is connected to this repository and deploys main on every push,
# so a saved update goes live a few minutes later. If the tests fail, nothing is
# saved and the live site keeps the previous day's content.

on:
  schedule:
    - cron: "17 4 * * *"      # 04:17 UTC every day
    - cron: "17 16 * * *"     # and 16:17 UTC, so a new video appears the same day
  workflow_dispatch:
    inputs:
      sources:
        description: "Only these source ids (space-separated), or leave empty for all"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pull new material from each source
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python scripts/update.py ${{ github.event.inputs.sources }}
      - name: Build and test with the new data
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/build.py
      - name: Save new data (Cloudflare deploys it)
        run: |
          git config user.name "harkhowal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily content update"
          git push
