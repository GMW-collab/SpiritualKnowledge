name: Test

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and build tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Browser tests (served the way Cloudflare serves the site)
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python tests/browser_check.py

  accessibility:
    # axe-core audit (WCAG 2.1 A/AA) of every kind of page, light and dark, desktop and phone.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Accessibility audit
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm install --no-save axe-core@4.10.2
          python tests/a11y_check.py node_modules/axe-core/axe.min.js

  cloudflare-config:
    # Runs the same command Cloudflare runs, without deploying: checks wrangler.jsonc,
    # runs the custom build and lists the files that would be uploaded.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wrangler dry run
        run: npx --yes wrangler@4 deploy --dry-run
